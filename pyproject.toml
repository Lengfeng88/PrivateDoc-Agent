[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privatedoc-agent"
version = "0.1.0"
description = "Local-first, privacy-preserving RAG with cost-aware routing"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111,<0.113",
    "uvicorn[standard]>=0.30,<0.31",
    "python-multipart>=0.0.9",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<0.29",
    "tenacity>=8.4,<9",
    "qdrant-client>=1.10,<2",
    "sentence-transformers>=3.0,<4",
    "langchain>=0.2,<0.3",
    "langchain-community>=0.2,<0.3",
    "langgraph>=0.1,<0.2",
    "openai>=1.40,<2",
    "rank-bm25>=0.2,<0.3",
    "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
]
eval = [
    "ragas>=0.1,<0.2",
    "datasets>=2.20,<3",
]
notebooks = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "rich>=13.7",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "agent", "ingest", "router", "eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]
addopts = "-v --tb=short -q"