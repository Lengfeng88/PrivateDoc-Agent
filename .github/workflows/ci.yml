name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy types-requests pydantic
      - name: ruff lint
        run: ruff check . --ignore E501 || true
      - name: ruff format check
        run: ruff format --check . || true

  route-eval:
    name: Route eval
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          pip install pydantic pydantic-settings spacy pytest
          python -m spacy download en_core_web_sm
      - name: Run route classifier tests
        run: |
          mkdir -p reports
          python -m pytest eval/route_eval.py -v --tb=short \
            --junitxml=reports/route_eval.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-eval-report
          path: reports/route_eval.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: privatedoc-api:ci

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: frontend
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
